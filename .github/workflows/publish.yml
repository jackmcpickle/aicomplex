name: Publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, changelog, and tag
        id: release
        run: |
          set -euo pipefail
          if ! bunx --bun commit-and-tag-version@13; then
            echo "No releasable commits since last tag; skipping release."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        if: steps.release.outputs.released == 'true'
        run: git push --follow-tags origin HEAD:main

  cut-release:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.bump.outputs.version }}
    permissions:
      contents: write
      id-token: write
